global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["hydraulic-rabbitmq:15692"]

  - job_name: "api"
    static_configs:
      - targets: ["hydraulic-app:8000"] # API отдает метрики на /metrics

  - job_name: "worker"
    static_configs:
      - targets: ["hydraulic-worker:8002"] # Воркер отдает метрики на 8002
