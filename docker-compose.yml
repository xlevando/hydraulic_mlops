services:
  postgres:
    image: postgres:16-alpine
    container_name: hydraulic-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hydraulic_mlops
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hydraulic_mlops"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - hydraulic-network
    restart: unless-stopped

  app:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: hydraulic-app
      environment:
        # Вложенные поля переопределяются через разделитель `__` (env_nested_delimiter)
        DATABASE__URL: "postgresql://postgres:postgres@postgres:5432/hydraulic_mlops"
        LOG_LEVEL: INFO
        ENVIRONMENT: development
      volumes:
        - ./config.yaml:/app/config.yaml:ro
      ports:
        - "8000:8000"
      depends_on:
        postgres:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "uv run python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 10s
      logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "3"
      deploy:
        resources:
          limits:
            cpus: "1.0"
            memory: 512M
          reservations:
            cpus: "0.25"
            memory: 256M
      networks:
        - hydraulic-network
      restart: unless-stopped


volumes:
  postgres-data:


networks:
  hydraulic-network:
    driver: bridge
