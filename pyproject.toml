[project]
name = "hydraulic-mlops"
version = "0.1.0"
description = "MLOps-система диагностики гидравлических систем"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
start = "src.app:main"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
web = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "structlog>=26.1.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "RUF",  # ruff-specific
    "BLE",  # flake8-blind-except: запрещает except Exception без уважительной причины
    "ANN",  # flake8-annotations
]
ignore = [
    "RUF001",  # кириллические строки — ложные срабатывания
    "RUF002",  # кириллические docstring — ложные срабатывания
    "RUF003",  # кириллические комментарии — ложные срабатывания
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # аннотации в тестах не несут контракта

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
